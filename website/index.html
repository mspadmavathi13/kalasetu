    <style>
        /* ============================================================
           KALASETU — DESIGN TOKENS
           Heritage palette: deep indigo, terracotta, saffron, muted gold,
           warm ivory, sand, deep maroon, muted green, dark brown.
           Light + dark themes via [data-theme] attribute on <html>.
           ============================================================ */
        :root {
          --font-display: 'Fraunces', Georgia, serif;
          --font-body: 'Work Sans', -apple-system, sans-serif;

          --radius-sm: 6px;
          --radius-md: 12px;
          --radius-lg: 22px;
          --shadow-card: 0 1px 2px rgba(43,30,20,0.06), 0 8px 24px -12px rgba(43,30,20,0.18);
          --shadow-lift: 0 20px 45px -18px rgba(43,30,20,0.35);
          --ease: cubic-bezier(.22,.61,.36,1);
        }

        html[data-theme="light"] {
          /* Warm Indian heritage palette: ivory, sandalwood, terracotta, olive and restrained indigo. */
          --bg: #F7F0E4;
          --bg-alt: #E9DDC8;
          --bg-deep: #DCCBB0;
          --surface: #FFFDF8;
          --surface-raised: #FFFFFF;
          --line: rgba(73,52,35,0.15);
          --line-strong: rgba(73,52,35,0.28);

          --text: #2D2118;
          --text-muted: #6B5948;
          --text-soft: #927F6B;

          /* Deep indigo is now an accent rather than the dominant light-mode colour. */
          --indigo: #344766;
          --indigo-ink: #24344D;
          --terracotta: #B94F2F;
          --terracotta-ink: #8F3B24;
          --saffron: #C98224;
          --gold: #9B7425;
          --maroon: #6D2630;
          --green: #566044;
          --olive: #70784C;
          --ultramarine: #4053A0;
          --earth-brown: #684630;
          --red-earth: #9F4330;
          --cream: #FBF3E7;

          --accent: var(--terracotta);
          --accent-ink: var(--terracotta-ink);
        }

        html[data-theme="dark"] {
          --bg: #1B140E;
          --bg-alt: #241B13;
          --bg-deep: #150F0A;
          --surface: #241C15;
          --surface-raised: #2C2219;
          --line: rgba(240,224,200,0.12);
          --line-strong: rgba(240,224,200,0.24);

          --text: #F4E9D8;
          --text-muted: #CBB79E;
          --text-soft: #97846D;

          /* Dark-theme indigo surfaces are intentionally deep, not pale blue,
             so light text remains readable and the heritage palette stays warm. */
          --indigo: #304A45;
          --indigo-ink: #1C2E2A;
          --terracotta: #E38955;
          --terracotta-ink: #F0A876;
          --saffron: #F0AC4E;
          --gold: #DCB65B;
          --maroon: #C97882;
          --green: #8FAE81;
          --olive: #A5B77F;
          --ultramarine: #8FA8E8;
          --earth-brown: #B58A6A;
          --red-earth: #E08B72;
          --cream: #2C2219;

          --accent: var(--terracotta);
          --accent-ink: var(--terracotta-ink);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
          margin: 0;
          background: var(--bg);
          color: var(--text);
          font-family: var(--font-body);
          -webkit-font-smoothing: antialiased;
          transition: background .35s var(--ease), color .35s var(--ease);
        }
        img, svg { display: block; max-width: 100%; }
        button { font-family: inherit; cursor: pointer; }
        a { color: inherit; text-decoration: none; }
        h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; line-height: 1.08; font-weight: 600; color: var(--text); }
        p { margin: 0; }

        /* ============================================================
           TYPE UTILITIES
           ============================================================ */
        .eyebrow {
          font-family: var(--font-body);
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: var(--accent);
        }
        .eyebrow.on-dark { color: var(--saffron); }
        .display-xl { font-size: clamp(40px, 6vw, 76px); letter-spacing: -0.01em; }
        .display-lg { font-size: clamp(32px, 4.4vw, 52px); letter-spacing: -0.01em; }
        .display-md { font-size: clamp(24px, 3vw, 34px); }
        .serif-italic { font-style: italic; font-weight: 500; }
        .body-lg { font-size: 19px; line-height: 1.6; color: var(--text-muted); }
        .body-md { font-size: 16px; line-height: 1.65; color: var(--text-muted); }
        .body-sm { font-size: 14px; line-height: 1.6; color: var(--text-soft); }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
        .section { padding: 96px 0; position: relative; }
        .section-tight { padding: 64px 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
        .center { text-align: center; }
        .stack { display: flex; flex-direction: column; }
        .row { display: flex; align-items: center; }
        .spread { display: flex; align-items: center; justify-content: space-between; }

        @media (max-width: 860px) {
          .grid-2 { grid-template-columns: 1fr; gap: 36px; }
          .section { padding: 64px 0; }
          .wrap { padding: 0 20px; }
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
          display: inline-flex; align-items: center; justify-content: center; gap: 8px;
          padding: 15px 30px; border-radius: 999px; border: 1px solid transparent;
          font-size: 15px; font-weight: 600; transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
          white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: #FFF8EE; box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
        .btn-outline { background: transparent; border-color: var(--line-strong); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-ghost { background: var(--surface-raised); border-color: var(--line); color: var(--text); }
        .btn-ghost:hover { border-color: var(--accent); }
        .btn-dark { background: var(--indigo); color: #F3EEE3; }
        .btn-dark:hover { transform: translateY(-2px); }
        .btn-sm { padding: 9px 18px; font-size: 13px; }
        .btn-block { width: 100%; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

        /* ============================================================
           NAV
           ============================================================ */
        .nav {
          position: sticky; top: 0; z-index: 50;
          backdrop-filter: blur(14px);
          background: color-mix(in srgb, var(--bg) 82%, transparent);
          border-bottom: 1px solid var(--line);
        }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; max-width: 1180px; margin: 0 auto; }
        .nav-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .nav-back { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; color: var(--text-muted); font-size: 23px; line-height: 1; cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .2s; flex: 0 0 auto; padding: 0 0 2px 0; }
        .nav-back:hover { background: var(--surface-raised); color: var(--accent); border-color: var(--line); transform: translateX(-1px); }
        .nav-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-word { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
        .brand-tag { display: block; font-size: 9.5px; letter-spacing: 0.18em; color: var(--text-soft); text-transform: uppercase; margin-top: -2px; }
        .nav-links { display: flex; align-items: center; gap: 6px; }
        .nav-link {
          padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--text-muted);
          transition: background .2s, color .2s;
        }
        .nav-link:hover { background: var(--bg-alt); color: var(--text); }
        .nav-link.active { background: var(--surface-raised); color: var(--accent); box-shadow: var(--shadow-card); }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
          width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          background: var(--surface-raised); border: 1px solid var(--line); position: relative; transition: border-color .2s;
        }
        .icon-btn:hover { border-color: var(--accent); }
        .cart-badge {
          position: absolute; top: -4px; right: -4px; background: var(--accent); color: #fff;
          font-size: 10px; font-weight: 700; width: 17px; height: 17px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
        }
        @media (max-width: 860px) { .nav-links { display: none; } }

        /* ============================================================
           CARDS
           ============================================================ */
        .card {
          background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
          box-shadow: var(--shadow-card);
        }
        .card-pad { padding: 32px; }

        /* ============================================================
           MOTIFS / DOODLES (decorative SVG backgrounds)
           ============================================================ */
        .motif-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .motif-layer svg { position: absolute; opacity: 0.5; }
        html[data-theme="dark"] .motif-layer svg { opacity: 0.35; }
        html[data-theme="dark"] .body-sm { color: var(--text-muted); }
        html[data-theme="dark"] .field-label { color: var(--text-muted); }
        html[data-theme="dark"] .transcript-box { color: var(--text); background: var(--surface); }
        .divider-scallop { height: 22px; width: 100%; display: block; }

        /* ============================================================
           FADE-IN ON SCROLL
           ============================================================ */
        .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
        .reveal.in { opacity: 1; transform: translateY(0); }

        /* ============================================================
           HERO
           ============================================================ */
        .hero { position: relative; padding: 88px 0 60px; overflow: hidden; }
        .hero-journey {
          display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: nowrap;
          margin: 0 auto; padding: 12px 4px; overflow-x: auto; overflow-y: hidden;
          scrollbar-width: thin; white-space: nowrap;
        }
        .hero-journey .jstep {
          display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto;
          padding: 6px 4px; font-size: 13px; font-weight: 650; color: var(--text-muted);
        }
        .hero-journey .jstep .dot {
          width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          background: transparent; border: 1px solid var(--line); font-size: 13px;
        }
        .hero-journey .arrow { color: var(--accent); font-size: 15px; flex: 0 0 auto; }
        .hero-journey-label { text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-soft); margin-bottom:2px; }
        .hero-visual {
          position: relative; aspect-ratio: 1/1; border-radius: 32px; overflow: hidden;
          background: var(--surface-raised); border: 1px solid var(--line);
          box-shadow: var(--shadow-lift); display: grid; grid-template-rows: 62% 38%;
        }
        .hero-art {
          position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(160deg, var(--indigo) 0%, var(--indigo-ink) 100%);
        }
        .hero-art .motif-layer { inset: 0; }
        .hero-art-icon { position: relative; z-index: 1; font-size: 64px; line-height: 1; filter: drop-shadow(0 8px 12px rgba(0,0,0,.16)); }
        .hero-caption {
          position: relative; z-index: 2; background: var(--surface-raised); color: var(--text);
          padding: 24px 30px; display: flex; flex-direction: column; justify-content: center;
          border-top: 1px solid var(--line);
        }
        .hero-caption .quote { color: var(--accent); font-family: Georgia, serif; font-size: 18px; font-style: italic; line-height: 1.45; margin: 0; }
        .hero-caption .caption-note { color: var(--text-muted); font-size: 13px; line-height: 1.55; margin: 9px 0 0; }
        .hero-caption .caption-rule { width: 48px; height: 2px; background: var(--accent); margin: 12px 0 0; opacity: .7; }
        @media (max-width: 860px) {
          .hero-visual { aspect-ratio: auto; min-height: 540px; grid-template-rows: 58% 42%; }
        }

        /* ============================================================
           PRODUCT CARDS
           ============================================================ */
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
        @media (max-width: 980px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 620px) { .product-grid { grid-template-columns: 1fr; } }
        .product-card {
          background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
          overflow: hidden; cursor: pointer; transition: transform .35s var(--ease), box-shadow .35s var(--ease);
        }
        .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lift); }
        .product-media { aspect-ratio: 4/3.1; position: relative; overflow: hidden; }
        .product-media svg { width: 100%; height: 100%; transition: transform .6s var(--ease); }
        .product-card:hover .product-media svg { transform: scale(1.06); }
        .product-cat-badge {
          position: absolute; top: 12px; left: 12px; background: rgba(20,15,10,0.55); color: #FBF3E7;
          font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px;
          backdrop-filter: blur(4px);
        }
        .product-body { padding: 20px 20px 22px; }
        .product-artisan { font-size: 12.5px; color: var(--text-soft); margin-bottom: 3px; }
        .product-name { font-size: 18px; font-weight: 600; font-family: var(--font-display); margin-bottom: 8px; }
        .product-story-snip { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; margin-bottom: 14px; }
        .product-foot { display: flex; align-items: center; justify-content: space-between; }
        .price-tag { font-size: 17px; font-weight: 700; color: var(--accent-ink); font-family: var(--font-display); }

        /* ============================================================
           WISDOM LAYER
           ============================================================ */
        .wisdom-card {
          position: relative; border-radius: 28px; padding: 44px;
          background: linear-gradient(155deg, var(--maroon) 0%, #3E1016 100%);
          color: #F7E9DD; overflow: hidden;
        }
        html[data-theme="dark"] .wisdom-card { background: linear-gradient(155deg, #4A171F 0%, #2A0D11 100%); }
        .wisdom-card .eyebrow { color: #E8B98F; }
        .wisdom-card h3 { color: #FBF0E6; }
        .wisdom-card .wisdom-quote { font-family: var(--font-display); font-style: italic; font-size: 20px; line-height: 1.5; color: #F3DFCB; }
        .wisdom-tag {
          display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
          background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); color: #F3DFCB;
          padding: 6px 13px; border-radius: 999px;
        }

        /* ---- Wisdom CTA banner on the product page (separate, prominent entry point) ---- */
        .wisdom-cta-banner {
          position: relative; overflow: hidden; margin-top: 44px; border-radius: 28px; padding: 40px 44px;
          background: linear-gradient(155deg, var(--indigo, #2B3A57) 0%, var(--maroon) 100%);
          display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap;
          cursor: pointer; transition: transform .25s ease, box-shadow .25s ease;
        }
        .wisdom-cta-banner:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
        .wisdom-cta-text { flex: 1; min-width: 260px; position: relative; z-index: 1; }
        .wisdom-cta-btn { white-space: nowrap; position: relative; z-index: 1; }
        @media (max-width: 640px) { .wisdom-cta-banner { padding: 30px 26px; } }

        /* ============================================================
           WISDOM LAYER — dedicated per-product editorial page
           ============================================================ */
        .wisdom-flow {max-width:900px;margin:0 auto;}
.wisdom-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.wisdom-photo-card{margin:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);}.wisdom-photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.wisdom-photo-card figcaption{padding:12px 13px 14px;display:grid;gap:4px;}.wisdom-photo-card figcaption span{color:var(--text-muted);font-size:12px;}.wisdom-making-photo{border-top:3px solid var(--gold,var(--accent));}
.wisdom-material-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}.wisdom-material-card{padding:22px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);}.wisdom-material-number{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800;}
.wisdom-artisan-card{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:stretch;padding:22px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-card);}.wisdom-artisan-photo{min-height:300px;border-radius:var(--radius-md);overflow:hidden;background:var(--bg-alt);display:grid;place-items:center;}.wisdom-artisan-photo img{width:100%;height:100%;min-height:300px;object-fit:cover;display:block;}
.wisdom-artisan-initials{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:34px;font-weight:800;}.wisdom-artisan-info{padding:10px 4px;}.wisdom-publish-subhead{font-size:13px;letter-spacing:.1em;font-weight:800;color:var(--accent);text-transform:uppercase;}.wisdom-photo-admin-card{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);}@media(max-width:760px){.wisdom-photo-grid,.wisdom-material-grid{grid-template-columns:1fr}.wisdom-artisan-card{grid-template-columns:1fr}.wisdom-artisan-photo{min-height:250px}.wisdom-artisan-photo img{min-height:250px}}
.wisdom-layer-page { background: var(--bg); }
        .wisdom-hero {
          position: relative; overflow: hidden; padding: 90px 0 70px;
          background: linear-gradient(165deg, var(--maroon) 0%, #2A0D11 100%);
        }
        html[data-theme="dark"] .wisdom-hero { background: linear-gradient(165deg, #4A171F 0%, #1B0A0C 100%); }

        .wisdom-split { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
        .wisdom-split.reverse { direction: rtl; }
        .wisdom-split.reverse > * { direction: ltr; }
        @media (max-width: 820px) { .wisdom-split, .wisdom-split.reverse { grid-template-columns: 1fr; direction: ltr; } }

        .wisdom-media-frame {
          aspect-ratio: 1/1; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card);
          border: 1px solid var(--line);
        }
        .wisdom-quote-lg {
          font-family: var(--font-display); font-style: italic; font-size: 22px; line-height: 1.6;
          color: var(--text); margin-top: 22px; padding-left: 22px; border-left: 3px solid var(--accent);
        }

        .wisdom-making-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 18px; margin-top: 32px; }
        @media (max-width: 760px) { .wisdom-making-grid { grid-template-columns: 1fr; } }
        .video-placeholder {
          position: relative; aspect-ratio: 16/10; border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
          background: linear-gradient(155deg, var(--indigo, #2B3A57) 0%, #17222E 100%);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          padding: 20px; text-align: center; transition: transform .25s ease;
        }
        .video-placeholder:hover { transform: scale(1.015); }
        .video-play-btn {
          width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.14);
          border: 1.5px solid rgba(255,255,255,0.4); color: #fff; display: flex; align-items: center; justify-content: center;
          font-size: 20px; padding-left: 4px;
        }
        .video-caption { color: rgba(255,255,255,0.85); font-size: 13.5px; font-weight: 600; max-width: 260px; }
        .wisdom-process-thumb {
          aspect-ratio: 16/10; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line);
        }

        .cultural-context-box {
          margin-top: 40px; padding: 26px 28px; border-radius: var(--radius-md);
          background: var(--bg-alt); border-left: 3px solid var(--gold, var(--accent));
        }

        .artisan-portrait {
          aspect-ratio: 1/1; border-radius: 50%; max-width: 260px; margin: 0 auto;
          background: linear-gradient(155deg, var(--terracotta) 0%, var(--maroon) 100%);
          display: flex; align-items: center; justify-content: center;
          font-family: var(--font-display); font-size: 64px; font-weight: 600; color: #FBF0E6;
          box-shadow: var(--shadow-card);
        }

        .wisdom-finale { text-align: center; }
        .wisdom-finale-frame {
          width: 220px; aspect-ratio: 1/1; margin: 0 auto; border-radius: var(--radius-lg); overflow: hidden;
          box-shadow: var(--shadow-card); border: 1px solid var(--line);
        }

        /* Generic modal (shared by video placeholder + any future dialogs) */
        .modal-overlay {
          position: fixed; inset: 0; background: rgba(20,14,10,0.55); z-index: 400;
          display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-card {
          background: var(--surface-raised); border-radius: var(--radius-lg); padding: 32px;
          box-shadow: var(--shadow-lift); max-width: 440px; width: 100%;
        }

        /* ============================================================
           STEP WIZARD (onboarding)
           ============================================================ */
        .wizard-rail { display: flex; align-items: center; gap: 6px; margin-bottom: 40px; flex-wrap: wrap; }
        .wizard-dot {
          display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: var(--text-soft);
          padding: 7px 8px 7px 7px; border-radius: 999px;
        }
        .wizard-dot .num {
          width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          background: var(--bg-alt); font-size: 12.5px; color: var(--text-muted); transition: background .3s, color .3s;
        }
        .wizard-dot.active .num { background: var(--accent); color: #fff; }
        .wizard-dot.done .num { background: var(--green); color: #fff; }
        .wizard-dot.active, .wizard-dot.done { color: var(--text); }
        .wizard-line { width: 22px; height: 1px; background: var(--line-strong); }

        .record-orb {
          width: 128px; height: 128px; border-radius: 50%; margin: 0 auto;
          display: flex; align-items: center; justify-content: center; font-size: 44px;
          background: var(--surface-raised); border: 2px solid var(--line); transition: all .3s var(--ease);
          box-shadow: var(--shadow-card);
        }
        .record-orb.live {
          background: var(--terracotta); border-color: var(--terracotta); color: #fff;
          animation: pulse-ring 1.6s infinite;
        }
        @keyframes pulse-ring {
          0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--terracotta) 55%, transparent); }
          70% { box-shadow: 0 0 0 22px color-mix(in srgb, var(--terracotta) 0%, transparent); }
          100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--terracotta) 0%, transparent); }
        }
        .transcript-box {
          width: 100%; min-height: 110px; border-radius: var(--radius-md); border: 1px solid var(--line);
          background: var(--surface); padding: 16px 18px; font-family: var(--font-body); font-size: 15.5px;
          color: var(--text); resize: vertical; line-height: 1.6;
        }
        .transcript-box:focus { outline: none; border-color: var(--accent); }

        .spinner {
          width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.35);
          border-top-color: #fff; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .field-label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 7px; display: block; }
        .field-input, .field-textarea {
          width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 13px;
          font-family: var(--font-body); font-size: 15px; color: var(--text); background: var(--surface);
        }
        .field-textarea { resize: vertical; line-height: 1.55; }
